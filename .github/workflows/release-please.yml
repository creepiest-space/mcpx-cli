name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: node

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2

      - name: Use npm version compatible with trusted publishing
        run: npm install --global npm@11.19.0

      - name: Install
        run: bun ci

      - name: Verify release tag
        run: node scripts/verify-release.mjs
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}

      - name: Quality gate
        run: bun run check:full

      - name: Audit dependencies
        run: bun audit

      - name: Test package
        run: bun run test:package

      - name: Publish to npmjs
        run: npm publish --ignore-scripts --provenance
